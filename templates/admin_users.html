{% extends "base.html" %}{% block title %}Users{% endblock %}{% block content %}<main class="app-main"><div class="container"><h1>Users Management</h1><form class="toolbar"><input name="q" value="{{q}}" placeholder="Search"><button class="btn">Search</button></form><div class="table-wrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td>{{'Active' if u.is_active else 'Inactive'}}</td><td><form style="display:inline" method="post" action="{{url_for('admin_user_toggle',user_id=u.id)}}"><button class="btn small secondary">{{'Deactivate' if u.is_active else 'Activate'}}</button></form> <form style="display:inline" method="post" action="{{url_for('admin_user_delete',user_id=u.id)}}"><button class="btn small danger" data-confirm="Delete this user?">Delete</button></form></td></tr>{% endfor %}</table></div></div></main>{% endblock %}
