{% extends "base.html" %}{% block title %}Reset Password{% endblock %}{% block content %}<div class="auth-wrap"><div class="auth-card reveal">{% if valid %}<h1>Choose a new password</h1><form method="post"><div class="field"><label>New Password</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Confirm Password</label><input name="confirm_password" type="password" minlength="8" required></div><button class="btn">Update Password</button></form>{% else %}<h1>Reset link expired</h1><p class="muted">Request a new reset link.</p>{% endif %}</div></div>{% endblock %}
