{% extends "base.html" %}{% block title %}AI Assistant{% endblock %}{% block content %}<main class="app-main"><div class="container"><div class="section-head"><h1>AI Health Assistant</h1><p class="muted">General health education. Not a diagnosis or prescription.</p></div><div class="chat-layout"><div class="card"><input id="chatSearch" class="field" placeholder="Search chats"><button class="btn" id="newChat">+ New Chat</button><div id="chatList"></div></div><div class="card"><div id="messages" class="messages"><p class="muted">Create a chat to begin.</p></div><div class="chat-compose"><input id="message" placeholder="Ask a general health question"><button class="btn" id="send">Send</button></div></div></div></div></main><script>
let active=null;const list=document.getElementById('chatList'),msgs=document.getElementById('messages');const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function chats(q=''){let r=await fetch('/api/chats?q='+encodeURIComponent(q)),a=await r.json();list.innerHTML=a.map(x=>`<div class="chat-item" onclick="openChat(${x.id})">${esc(x.title)}</div>`).join('')}
async function openChat(id){active=id;let r=await fetch('/api/chats/'+id),c=await r.json();msgs.innerHTML=c.messages.map(m=>`<div class="msg ${m.role}">${esc(m.content)}</div>`).join('');msgs.scrollTop=msgs.scrollHeight}
document.getElementById('newChat').onclick=async()=>{let r=await fetch('/api/chats',{method:'POST'}),c=await r.json();active=c.id;await chats();openChat(c.id)}
async function send(){let i=document.getElementById('message'),t=i.value.trim();if(!t)return;if(!active){let r=await fetch('/api/chats',{method:'POST'});active=(await r.json()).id}msgs.innerHTML+=`<div class="msg user">${esc(t)}</div><div class="msg assistant">Thinking…</div>`;i.value='';let r=await fetch('/api/chats/'+active+'/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})}),d=await r.json();let a=msgs.querySelectorAll('.msg');a[a.length-1].textContent=d.answer||d.error||'AI service unavailable';msgs.scrollTop=msgs.scrollHeight;chats()}
document.getElementById('send').onclick=send;document.getElementById('message').onkeydown=e=>{if(e.key==='Enter')send()};document.getElementById('chatSearch').oninput=e=>chats(e.target.value);chats();
</script>{% endblock %}
