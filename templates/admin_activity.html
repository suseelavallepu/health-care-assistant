{% extends "base.html" %}{% block title %}Activity Log{% endblock %}{% block content %}<main class="app-main"><div class="container"><h1>Activity Log</h1><div class="table-wrap" style="margin-top:20px"><table class="table"><tr><th>Action</th><th>Target</th><th>Admin</th><th>Time</th></tr>{% for l in logs %}<tr><td>{{l.action}}</td><td>{{l.target}}</td><td>{{l.admin.email if l.admin else '—'}}</td><td>{{l.timestamp.strftime('%d %b %Y %H:%M')}}</td></tr>{% endfor %}</table></div></div></main>{% endblock %}
