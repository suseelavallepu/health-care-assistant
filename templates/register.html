{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}<div class="auth-wrap"><form class="auth-card reveal" method="post"><h1>Create your account</h1><p class="muted">Start with your basic account information.</p><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Confirm Password</label><input name="confirm_password" type="password" minlength="8" required></div><button class="btn" type="submit">Create Account</button><p>Already registered? <a class="arrow" href="{{url_for('login')}}">Login</a></p></form></div>{% endblock %}
