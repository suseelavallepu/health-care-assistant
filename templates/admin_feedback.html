{% extends "base.html" %}{% block title %}Feedback{% endblock %}{% block content %}<main class="app-main"><div class="container"><h1>Feedback Management</h1><form class="toolbar"><input name="q" value="{{q}}" placeholder="Search"><button class="btn">Search</button></form><div class="table-wrap"><table class="table"><tr><th>User</th><th>Feature</th><th>Rating</th><th>Comment</th><th>Date</th></tr>{% for f in feedback %}<tr><td>{{f.user.name}}</td><td>{{f.feature}}</td><td>{{f.rating}}/5</td><td>{{f.comment}}</td><td>{{f.created_at.strftime('%d %b %Y %H:%M')}}</td></tr>{% endfor %}</table></div></div></main>{% endblock %}
