{% extends "base.html" %}{% block title %}Mapping{% endblock %}{% block content %}<main class="app-main"><div class="container"><h1>Symptom–Condition Mapping</h1><p class="muted">The database relationships here directly control matching.</p><form class="card" method="post"><div class="grid"><div class="field"><label>Symptom</label><select name="symptom_id">{% for s in symptoms %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></div><div class="field"><label>Condition</label><select name="condition_id">{% for c in conditions %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div></div><button class="btn">Add Mapping</button></form><div class="table-wrap" style="margin-top:20px"><table class="table"><tr><th>Symptom</th><th>Condition</th><th>Action</th></tr>{% for s,c in mappings %}<tr><td>{{s.name}}</td><td>{{c.name}}</td><td><form method="post" action="{{url_for('admin_mapping_delete')}}"><input type="hidden" name="symptom_id" value="{{s.id}}"><input type="hidden" name="condition_id" value="{{c.id}}"><button class="btn danger small">Delete</button></form></td></tr>{% endfor %}</table></div></div></main>{% endblock %}
