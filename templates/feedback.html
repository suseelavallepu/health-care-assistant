{% extends "base.html" %}{% block title %}Feedback{% endblock %}{% block content %}<div class="auth-wrap"><form class="auth-card" method="post"><h1>Feedback</h1><div class="field"><label>Rating</label><select name="rating" required>{% for i in range(1,6) %}<option value="{{i}}">{{i}} star{% if i>1 %}s{% endif %}</option>{% endfor %}</select></div><div class="field"><label>Feature</label><select name="feature">{% for x in ['Symptom Checker','AI Health Assistant','Health Dashboard','MedKit','Health Report','Overall Website'] %}<option>{{x}}</option>{% endfor %}</select></div><div class="field"><label>Comment</label><textarea name="comment"></textarea></div><button class="btn">Submit Feedback</button></form></div>{% endblock %}
