<!doctype html><html lang="en"><head><meta name="csrf-token" content="{{csrf_token()}}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Healthcare Assistant{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body>
<header class="site-header"><div class="container nav"><a class="brand" href="{{url_for('home')}}"><span class="brand-mark">+</span>Healthcare Assistant</a>
<nav class="nav-links">{% if current_user %}<a href="{{url_for('profile')}}">Profile</a><a class="btn small" href="{{url_for('logout')}}">Logout</a>{% elif current_admin %}<a href="{{url_for('admin_profile')}}">Profile</a><a class="btn small" href="{{url_for('admin_logout')}}">Logout</a>{% else %}<a href="{{url_for('login')}}">Login</a><a href="{{url_for('register')}}">Register</a><a href="{{url_for('admin_login')}}">Admin</a>{% endif %}</nav></div></header>
{% with messages=get_flashed_messages(with_categories=true) %}<div class="container">{% for category,msg in messages %}<div class="alert {{category}}">{{msg}}</div>{% endfor %}</div>{% endwith %}
{% block content %}{% endblock %}<script src="{{url_for('static',filename='js/main.js')}}"></script></body></html>
